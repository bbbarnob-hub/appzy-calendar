name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" ./app-debug.apk
          cp "$APK" ./app.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ./app.apk ./app-debug.apk \
            --title "Latest APK" \
            --notes "Built automatically by APPZY from commit ${GITHUB_SHA:0:7}" \
            --latest
          echo "APK_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/app-debug.apk"
